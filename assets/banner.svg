<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0a0d18; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Mesh Glow Gradients -->
    <radialGradient id="glowPurple" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCyan" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Text Linear Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Pulsing Node Animation -->
    <style>
      @keyframes pulseRing {
        0% { r: 6; opacity: 0.9; }
        50% { r: 16; opacity: 0.2; }
        100% { r: 6; opacity: 0.9; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes dashMove {
        0% { stroke-dashoffset: 240; }
        100% { stroke-dashoffset: 0; }
      }
      .node-pulse {
        animation: pulseRing 3s ease-in-out infinite;
      }
      .floating-cards {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .flow-path {
        stroke-dasharray: 8 6;
        animation: dashMove 12s linear infinite;
      }
      .pulse-delay-1 { animation-delay: 0.8s; }
      .pulse-delay-2 { animation-delay: 1.6s; }
      .pulse-delay-3 { animation-delay: 2.4s; }
    </style>
  </defs>

  <!-- Deep Background Layer -->
  <rect width="1200" height="360" fill="url(#bgGradient)" />
  <rect width="1200" height="360" fill="url(#glowPurple)" />
  <rect width="1200" height="360" fill="url(#glowCyan)" />

  <!-- Subtle Ambient Circuit / Grid Pattern -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="360" stroke-dasharray="4 8" />
    <line x1="300" y1="0" x2="300" y2="360" stroke-dasharray="4 8" />
    <line x1="500" y1="0" x2="500" y2="360" stroke-dasharray="4 8" />
    <line x1="700" y1="0" x2="700" y2="360" stroke-dasharray="4 8" />
    <line x1="900" y1="0" x2="900" y2="360" stroke-dasharray="4 8" />
    <line x1="1100" y1="0" x2="1100" y2="360" stroke-dasharray="4 8" />
    <line x1="0" y1="80" x2="1200" y2="80" stroke-dasharray="4 8" />
    <line x1="0" y1="180" x2="1200" y2="180" stroke-dasharray="4 8" />
    <line x1="0" y1="280" x2="1200" y2="280" stroke-dasharray="4 8" />
  </g>

  <!-- Animated Data Sync Paths (Background layer behind text) -->
  <g fill="none" opacity="0.35">
    <path class="flow-path" d="M 120 70 Q 300 130 600 80 T 1080 110" stroke="#0ea5e9" stroke-width="2.5" />
    <path class="flow-path" d="M 80 290 Q 400 220 750 270 T 1120 250" stroke="#a855f7" stroke-width="2.5" style="animation-duration: 9s;" />
    <path class="flow-path" d="M 200 330 Q 600 200 1000 310" stroke="#10b981" stroke-width="1.8" style="animation-duration: 15s;" />
  </g>

  <!-- Glowing Dynamic Nodes -->
  <g>
    <!-- Node 1 -->
    <circle cx="160" cy="110" r="14" fill="#0ea5e9" fill-opacity="0.2" class="node-pulse" />
    <circle cx="160" cy="110" r="5" fill="#38bdf8" />

    <!-- Node 2 -->
    <circle cx="1040" cy="110" r="14" fill="#6366f1" fill-opacity="0.2" class="node-pulse pulse-delay-1" />
    <circle cx="1040" cy="110" r="5" fill="#818cf8" />

    <!-- Node 3 -->
    <circle cx="140" cy="270" r="14" fill="#10b981" fill-opacity="0.2" class="node-pulse pulse-delay-2" />
    <circle cx="140" cy="270" r="5" fill="#34d399" />

    <!-- Node 4 -->
    <circle cx="1060" cy="260" r="14" fill="#f43f5e" fill-opacity="0.2" class="node-pulse pulse-delay-3" />
    <circle cx="1060" cy="260" r="5" fill="#fb7185" />
  </g>

  <!-- Dynamic Animated Floating Pills / Badges in Corners (Non-Obstructive) -->
  <g class="floating-cards" opacity="0.85">
    <!-- Channel Pill Left -->
    <g transform="translate(60, 160)">
      <rect width="135" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="18" cy="16" r="5" fill="#10b981" />
      <text x="32" y="21" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="0.5">INVENTORY SYNC</text>
    </g>
    <!-- Channel Pill Right -->
    <g transform="translate(1005, 160)">
      <rect width="135" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="18" cy="16" r="5" fill="#38bdf8" />
      <text x="32" y="21" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="0.5">BUY BOX REPRICE</text>
    </g>
  </g>

  <!-- Foreground Content: Titles & Highlights (Guaranteed Foreground & Sharp) -->
  <g text-anchor="middle">
    <!-- Category Mini-Badge -->
    <g transform="translate(600, 52)">
      <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#1e1b4b" stroke="url(#badgeGrad)" stroke-width="1.5" />
      <text y="5" fill="#a5b4fc" font-size="11" font-weight="700" letter-spacing="1.5">ENTERPRISE COMMERCE ARCHITECTURE</text>
    </g>

    <!-- Primary Title -->
    <text x="600" y="132" fill="url(#titleGrad)" font-size="37" font-weight="800" letter-spacing="-0.5">
      Awesome Multi-Channel Marketplace Management
    </text>

    <!-- Subtitle -->
    <text x="600" y="174" fill="#94a3b8" font-size="16" font-weight="500" letter-spacing="0.2">
      Curated Landscape of SaaS Platforms, Feed Engines &amp; Open-Source Inventory Orchestrators
    </text>

    <!-- Core Pillar Indicators -->
    <g transform="translate(600, 240)">
      <!-- Pill 1 -->
      <g transform="translate(-250, 0)">
        <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#111827" stroke="#38bdf8" stroke-width="1.2" />
        <text y="5" fill="#e0f2fe" font-size="13" font-weight="600">⚡ Listing Feeds</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(0, 0)">
        <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#111827" stroke="#818cf8" stroke-width="1.2" />
        <text y="5" fill="#ede9fe" font-size="13" font-weight="600">🔄 Inventory Routing</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(250, 0)">
        <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#111827" stroke="#34d399" stroke-width="1.2" />
        <text y="5" fill="#d1fae5" font-size="13" font-weight="600">📦 Order Orchestration</text>
      </g>
    </g>

    <!-- Tagline Footer -->
    <text x="600" y="315" fill="#64748b" font-size="13" font-weight="500" letter-spacing="0.8">
      AMAZON · WALMART · EBAY · TIKTOK SHOP · SHOPIFY · TEMU · TARGET+ · WOOMMCOMMERCE
    </text>
  </g>
</svg>
